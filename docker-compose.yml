services:
  api:
    build: ./apps/api
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/athletic-meet
      JWT_SECRET: change-me-in-production
    volumes:
      - ./apps/api/data:/app/data
    depends_on:
      - mongo

  web:
    build: ./apps/web
    ports:
      - "3000:80"
    environment:
      VITE_API_URL: http://localhost:5000/api
    depends_on:
      - api

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
